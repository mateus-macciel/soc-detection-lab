id: R02
name: password_spraying
title: Password spraying a partir de um IP
description: Um mesmo IP falha logon em muitas contas diferentes dentro do mesmo intervalo de 15 minutos.
status: tuned
severity: high
source: windows
attack:
  tactic: Credential Access
  technique: T1110.003
  name: Password Spraying
  reference: https://attack.mitre.org/techniques/T1110/003/
params:
  bucket_seconds: 900
  min_distinct_accounts: 10
  exclude_ips: ["198.51.100.10"]
baseline:
  bucket_seconds: 900
  min_distinct_accounts: 5
  exclude_ips: []
false_positives:
  - Proxy ou NAT corporativo com muitos usuários errando a senha após o fim de semana
  - Teste de intrusão autorizado
response:
  - Identificar contas que tiveram sucesso (4624) a partir do mesmo IP
  - Bloquear o IP e forçar a redefinição das senhas das contas com sucesso
  - Revisar a política de senhas e a exigência de MFA
